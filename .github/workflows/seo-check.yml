name: SEO check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  faq-markup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - name: FAQPage JSON-LD matches the visible FAQ
        run: python3 scripts/seo_sync.py --check
